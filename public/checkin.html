<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F5F3">
<script>(function(){var t;try{t=localStorage.getItem('att_theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t})();</script>
<title>Check in | SEMI Bootcamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700;800&family=Red+Hat+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.wrap{max-width:460px;margin:0 auto;padding:22px 16px 130px}
.logo{height:30px;width:auto;margin:4px 0 26px}
h1{font-size:26px;margin-bottom:4px}
.when{color:var(--ink-2);margin-bottom:18px}
.notice{background:var(--amber-tint);color:var(--amber-ink);border-radius:var(--r);padding:12px 14px;font-size:14px;margin-bottom:6px}
.search{position:relative}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{padding:13px 14px 13px 42px;font-size:16px;border-radius:var(--r)}
.names{list-style:none;margin:12px 0 0;padding:0;overflow:hidden}
.names li+li{border-top:1px solid var(--line-soft)}
.name{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;border-radius:0;color:var(--ink);
  font:500 16px/1.3 var(--text);text-align:left;white-space:normal;justify-content:flex-start;box-shadow:none !important}
.name:hover{background:var(--surface-2);border:0}
.name .av{width:36px;height:36px;font-size:13px}
.name .id{margin-left:auto;flex:none}
.name .tick{margin-left:auto;flex:none;width:24px;height:24px;border-radius:50%;background:var(--green);color:var(--primary-fg);display:grid;place-items:center}
.name[aria-checked="true"]{background:var(--green-tint)}
:root[data-theme="dark"] .name[aria-checked="true"]{box-shadow:inset 3px 0 0 var(--green) !important}
.name[aria-checked="true"] .av{background:var(--green);color:var(--primary-fg)}
.name:disabled{opacity:1;color:var(--ink-3)}
.name:disabled .av{background:transparent;border:1.5px solid var(--line);color:var(--ink-3)}
.name .done-tag{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink-3)}
.empty{padding:16px 14px;color:var(--ink-2)}
.help{color:var(--ink-2);font-size:14px;margin-top:14px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  background:var(--bar);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar .inner{max-width:460px;margin:0 auto}
#go{width:100%;padding:16px;font-size:16.5px;border-radius:var(--r)}
#go:disabled{opacity:1;background:var(--primary-off);border-color:var(--primary-off);box-shadow:none;color:var(--primary-fg)}
:root[data-theme="dark"] #go:disabled{color:var(--ink-3)}
#m:empty{display:none}

/* success: one die fills with SEMI green */
.done{text-align:center;padding:32px 22px 28px;margin-top:6px}
.done .die{width:96px;height:96px;margin:0 auto 22px;border-radius:18px;border:2px solid var(--green);position:relative;overflow:hidden}
:root[data-theme="dark"] .done .die{box-shadow:0 0 28px rgba(91,194,80,.35)}
.done .die::before{content:"";position:absolute;inset:0;background:var(--green);transform:translateY(100%);animation:fill .7s cubic-bezier(.2,.8,.2,1) forwards}
.done.late .die{border-color:var(--amber)} .done.late .die::before{background:var(--amber)}
:root[data-theme="dark"] .done.late .die{box-shadow:0 0 28px rgba(242,169,43,.3)}
.done .die svg{position:absolute;inset:0;margin:auto;width:46px;opacity:0;animation:show .25s .55s forwards;color:var(--primary-fg)}
@keyframes fill{to{transform:none}} @keyframes show{to{opacity:1}}
.done h1{font-size:28px}
.done .who{font:700 20px/1.3 var(--display);margin:14px 0 4px}
.done .meta{color:var(--ink-2)}
.problem{padding:24px 22px}
.problem h1{color:var(--red)}
</style></head>
<body>
<div class="wrap">
  <img class="logo only-light" src="semi-logo.png" alt="SEMI"><img class="logo only-dark" src="semi-logo-white.png" alt="SEMI">
  <main id="box" aria-live="polite"><p class="muted">Loading the class list...</p></main>
</div>
<script src="common.js"></script>
<script>
// The QR code opens this page with ?e=<event>&t=<event code>. The student picks their name and taps Check in.
const q = new URLSearchParams(location.search), eventId = Number(q.get('e')), token = q.get('t');
const KEY = 'att_last_student';            // remembers the name chosen on this phone for next time
const remembered = () => { try { return localStorage.getItem(KEY); } catch { return null; } };
const remember = id => { try { localStorage.setItem(KEY, id); } catch {} };
let data = null, chosen = null;

function problem(title, text) {
  $('#box').innerHTML = `<div class="card problem"><h1>${esc(title)}</h1><p class="when" style="margin:6px 0 0">${esc(text)}</p></div>`;
}
async function load() {
  try { data = await api(`/api/checkin/names?e=${eventId}&t=${encodeURIComponent(token || '')}`); }
  catch (e) { return problem("This QR code didn't work", 'Scan the code on the screen in class again. If it still fails, tell the trainer.'); }
  if (!data.today) return problem(data.event, `This session is on ${fmtDate(data.date)}. Scan the QR code on the day.`);
  const last = remembered();
  if (last && data.names.some(n => String(n.id) === last && !n.checked_in)) chosen = last;
  // remembered name first, then everyone not yet checked in, checked-in names last
  data.names.sort((a, b) => (String(b.id) === chosen) - (String(a.id) === chosen) || a.checked_in - b.checked_in);
  $('#box').innerHTML = `
    <h1>${esc(data.event)}</h1>
    <p class="when">${fmtDate(data.date)}, starts ${esc(data.start_time)} ${esc(tzLabel(data.timezone, data.tz_offset))}</p>
    ${data.open ? '' : '<p class="notice">Check-in opens when the trainer starts the session. Pick your name now and tap Check in once it opens.</p>'}
    <label for="find">Find your name</label>
    <div class="search">${ICONS.search}<input id="find" type="search" placeholder="Start typing your name" autocomplete="off" enterkeyhint="search"></div>
    <ul class="names card" id="names" role="radiogroup" aria-label="Class list"></ul>
    <p class="help">Name not on the list? Tell the trainer and they will add you.</p>
    <div class="bar"><div class="inner"><div id="m" aria-live="assertive"></div><button id="go"></button></div></div>`;
  $('#find').oninput = drawNames;
  $('#go').onclick = checkIn;
  drawNames(); updateButton();
}
function drawNames() {
  const f = $('#find').value.trim().toLowerCase();
  const list = data.names.filter(n => !f || n.name.toLowerCase().includes(f) || n.username.toLowerCase().includes(f));
  $('#names').innerHTML = list.length ? list.map(n => `<li><button class="name" role="radio" data-id="${n.id}"
      aria-checked="${String(n.id) === chosen}" ${n.checked_in ? 'disabled' : ''}>
      ${n.checked_in ? '<span class="av">✓</span>' : avatar(n.name)}<span>${esc(n.name)}</span>${n.checked_in ? '<span class="done-tag">Checked in</span>'
        : String(n.id) === chosen ? '<span class="tick"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>' : `<span class="id">${esc(n.username)}</span>`}</button></li>`).join('')
    : `<li class="empty">No name matches "${esc(f)}". Check the spelling or tell the trainer.</li>`;
  $('#names').querySelectorAll('.name').forEach(b => b.onclick = () => { chosen = b.dataset.id; $('#m').innerHTML = ''; drawNames(); updateButton(); });
}
function updateButton() {
  const n = data.names.find(x => String(x.id) === chosen);
  $('#go').disabled = !n;
  $('#go').textContent = n ? `Check in as ${n.name}` : 'Choose your name above';
}
async function checkIn() {
  $('#go').disabled = true; $('#go').textContent = 'Checking in...';
  try {
    const r = await api('/api/checkin', { body: { eventId, token, studentId: Number(chosen) } });
    remember(chosen);
    const late = r.status === 'late';
    $('#box').innerHTML = `<div class="card done ${late ? 'late' : ''}">
      <div class="die"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1>You're checked in</h1>
      <p class="who">${esc(r.name)}</p>
      <p class="meta">${esc(r.event)}<br>${late ? `Arrived late at ${esc(r.time)}` : `On time at ${esc(r.time)}`}<br><span class="small">Session starts ${esc(r.start_time)} ${esc(tzLabel(r.timezone, r.tz_offset))}, late after ${r.late_after_min} min</span></p>
      <p class="help">You can close this page now.</p></div>`;
  } catch (e) {
    $('#m').innerHTML = `<div class="msg err" style="margin:0 0 10px">${esc(e.message)}</div>`;
    updateButton();
    if (e.status === 409) { data.names.forEach(n => { if (String(n.id) === chosen) n.checked_in = 1; }); chosen = null; drawNames(); updateButton(); }
  }
}
load();
</script>
</body></html>
